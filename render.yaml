services:
  - type: web
    name: averis-shipping-verification
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health

    envVars:
      - key: DATA_SOURCE
        value: /app
      - key: GROQ_API_KEY
        sync: false
      - key: SDOC_CLASSIFIER
        value: llm